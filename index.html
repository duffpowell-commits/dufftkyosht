<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reverse" />
  <title>Reverse Engineer Anything</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Reverse<span>.</span></h1>
    <nav>
      <button class="tab active" data-view="analyze">Analyze</button>
      <button class="tab" data-view="history">History</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>

  <main>
    <!-- ANALYZE -->
    <section id="view-analyze" class="view active">
      <p class="lede">Paste a post, ad, landing page, product, business, skill, design or chunk of code. Get the formula and a template you own.</p>

      <label class="field">
        <span>What are we tearing apart?</span>
        <textarea id="input" rows="6" placeholder="Paste text or a URL, or describe the thing (e.g. &quot;Why does Liquid Death sell water for $2?&quot;)"></textarea>
      </label>

      <div class="attach-row">
        <label class="btn ghost">
          📷 Photo / screenshot
          <input id="file" type="file" accept="image/*,application/pdf" multiple hidden />
        </label>
        <div id="thumbs" class="thumbs"></div>
      </div>

      <div class="field">
        <span>Lens</span>
        <div id="lenses" class="chips"></div>
      </div>

      <label class="field">
        <span>Goal (optional)</span>
        <input id="goal" type="text" placeholder="e.g. I want to make my own version for my trading newsletter" />
      </label>

      <button id="go" class="btn primary big">Reverse engineer it</button>
      <p id="status" class="status" aria-live="polite"></p>

      <div id="result"></div>
    </section>

    <!-- HISTORY -->
    <section id="view-history" class="view">
      <div class="row between">
        <h2>History</h2>
        <button id="clear-history" class="btn ghost small">Clear</button>
      </div>
      <ul id="history-list" class="history"></ul>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view">
      <h2>Settings</h2>
      <label class="field">
        <span>Anthropic API key</span>
        <input id="api-key" type="password" autocomplete="off" placeholder="sk-ant-..." />
        <small>Stored only on this device (localStorage). Requests go straight from your phone to api.anthropic.com.</small>
      </label>
      <label class="field">
        <span>Model</span>
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5 (best)</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (cheaper, fast)</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5 (dirt cheap)</option>
        </select>
      </label>
      <label class="field">
        <span>Depth (effort)</span>
        <select id="effort">
          <option value="low">Low – quick take</option>
          <option value="medium">Medium</option>
          <option value="high" selected>High – thorough</option>
          <option value="xhigh">X-High – go deep</option>
        </select>
      </label>
      <label class="check">
        <input id="web" type="checkbox" checked />
        Let Claude open URLs I paste
      </label>
      <button id="save-settings" class="btn primary">Save</button>
      <p id="settings-status" class="status"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
